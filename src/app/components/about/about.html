<div class="section-title">
  <span class="icon">💻</span> Technical Skills
</div>

<div class="skills-grid">
  <div class="skill-card" *ngFor="let category of skills">
    <h3>{{ category.title }}</h3>
    <div class="tags">
      <span class="tag" *ngFor="let item of category.list">{{ item }}</span>
    </div>
  </div>
</div>
<div class="section-title" style="margin-top: 40px;">
  <span class="icon">🎓</span> Education
</div>

<div class="education-container">
  <div class="edu-card" *ngFor="let edu of education">
    <div class="edu-header">
      <h3>{{ edu.period }}</h3>
      <h4>{{ edu.degree }} | {{ edu.institution }}</h4>
    </div>
    <ul>
      <li *ngFor="let detail of edu.details">{{ detail }}</li>
    </ul>
  </div>
</div>
